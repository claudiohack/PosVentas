# Reverse proxy local: un solo origen para la app y la API (sin CORS).
#   http://localhost:8080/        → frontend (Blazor WASM)
#   http://localhost:8080/api/... → api (ASP.NET Core)
# En DigitalOcean este mismo proxy termina TLS (443) y redirige el 80.

upstream posventas_api {
    server api:8080;
}

upstream posventas_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Los certificados de ARCA son el cuerpo más grande que se envía (la API admite hasta 256 KB)
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /api/ {
        proxy_pass http://posventas_api;
        # La facturación espera a ARCA (timeout propio de 30 s): margen para que el proxy no corte antes
        proxy_read_timeout 90s;
    }

    # Importación de productos desde Excel: la API admite planillas de hasta 5 MB
    location = /api/productos/importar {
        client_max_body_size 6m;
        proxy_pass http://posventas_api;
        proxy_read_timeout 90s;
    }

    location = /health {
        proxy_pass http://posventas_api;
    }

    location / {
        proxy_pass http://posventas_frontend;
    }
}
