# Sirve el cliente Blazor WebAssembly (archivos estáticos). Detrás del proxy de docker/proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los .wasm y .dll se comprimen al vuelo si el navegador lo pide (Blazor ya publica .br y .gz precomprimidos)
    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript application/json text/css;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # La configuración y la página de entrada no se cachean: así un despliegue nuevo se ve al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/appsettings.*\.json$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /_framework/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Ruteo del lado del cliente: cualquier ruta desconocida devuelve la app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
