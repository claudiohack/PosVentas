# PosVentas — https://pos.hstech.com.ar
# Cloudflare (proxy, modo Full strict) -> Nginx 443 con certificado Let's Encrypt -> API en 127.0.0.1:5100.
# El firewall solo deja entrar 80/443 desde Cloudflare (/usr/local/sbin/cloudflare-ips.sh).
upstream posventas_api {
    server 127.0.0.1:5100;
    keepalive 16;
}

# 80: solo el desafio de Let's Encrypt (renovaciones) y redireccion a https
server {
    listen 80;
    listen [::]:80;
    server_name pos.hstech.com.ar;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.hstech.com.ar;

    ssl_certificate     /etc/letsencrypt/live/pos.hstech.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.hstech.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:posventas_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/posventas/current/wwwroot;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_static on;
    gzip_types application/wasm application/octet-stream application/javascript application/json text/css;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location /api/ {
        proxy_pass http://posventas_api;
        proxy_read_timeout 90s;   # la facturacion espera a ARCA (timeout propio de 30 s)
    }
    location = /api/productos/importar {
        client_max_body_size 6m;  # planillas Excel de hasta 5 MB
        proxy_pass http://posventas_api;
        proxy_read_timeout 90s;
    }
    location = /health {
        proxy_pass http://posventas_api;
    }

    # Un despliegue nuevo se ve al recargar: la entrada y la configuracion no se cachean
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/appsettings.*\.json$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /_framework/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Ruteo del lado del cliente (Blazor)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
